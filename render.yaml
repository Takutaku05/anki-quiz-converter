services:
  - type: web
    name: anki-quiz-converter-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DOWNLOAD_LINK_TTL_SECONDS
        value: "1800"
      - key: DOWNLOAD_MAX_ENTRIES
        value: "100"
